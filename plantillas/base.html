{{define "cabecera"}}<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>domo-board</title>
<style>
:root {
  color-scheme: light dark;
  --fondo: #f6f7f9; --superficie: #fff; --texto: #1d2129; --suave: #6b7280; --borde: #8883;
  --icono: #eceef2; --ok: #2a8a4a; --aviso: #c27c0e; --error: #c53030; --acento: #2563eb;
}
@media (prefers-color-scheme: dark) {
  :root { --fondo: #14161a; --superficie: #1d2026; --texto: #e6e8eb; --suave: #9aa1ab; --icono: #2a2e36; --aviso: #e0a030; --error: #f06060; --acento: #6b9bff; }
}
* { box-sizing: border-box; }
body { font-family: system-ui, sans-serif; max-width: 1080px; margin: 0 auto; padding: 16px; line-height: 1.4; background: var(--fondo); color: var(--texto); }
header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
header form { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
h1 { font-size: 1.4rem; margin: 0; } h1 a { color: inherit; text-decoration: none; }
h2 { font-size: 1rem; font-weight: 600; color: var(--suave); text-transform: uppercase; letter-spacing: .04em; margin: 28px 0 12px; }
a { color: var(--acento); }
table { width: 100%; border-collapse: collapse; margin: 12px 0 24px; }
th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--borde); vertical-align: top; }
.suave { color: var(--suave); font-size: .9rem; }
.ok { color: var(--ok); } .aviso { color: var(--aviso); } .error { color: var(--error); }
code { font-size: .9em; }
button { font: inherit; padding: 6px 14px; cursor: pointer; border-radius: 8px; border: 1px solid var(--borde); background: var(--superficie); color: inherit; }
button.principal { background: var(--acento); border-color: var(--acento); color: #fff; }
button:disabled { opacity: .5; cursor: default; }
pre { background: #8881; padding: 12px; overflow-x: auto; white-space: pre-wrap; font-size: .85rem; border-radius: 8px; }
ul.cambios { margin: 4px 0 0; padding-left: 18px; }
.tabla { overflow-x: auto; }
.oculto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.barra { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* Rejilla de aplicaciones */
.rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 12px; list-style: none; margin: 0; padding: 0; }
.app { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 4px; border-radius: 14px; color: inherit; text-decoration: none; text-align: center; }
a.app:hover, a.app:focus-visible { background: var(--superficie); outline: none; box-shadow: 0 1px 4px #0002; }
.app .titulo { font-size: .85rem; line-height: 1.2; overflow-wrap: anywhere; }
.icono { position: relative; width: 64px; height: 64px; flex: none; border-radius: 16px; background: var(--icono); display: grid; place-items: center; }
.icono .inicial { font-size: 1.6rem; font-weight: 600; color: var(--suave); }
/* El icono tapa la inicial; si no carga, con alt vacío no se pinta y se ve la inicial. */
.icono img { position: absolute; inset: 8px; width: 48px; height: 48px; object-fit: contain; background: var(--icono); }
.icono.grande { width: 80px; height: 80px; border-radius: 20px; } .icono.grande img { inset: 10px; width: 60px; height: 60px; }

/* Marca en la esquina */
.marca { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--fondo); display: grid; place-items: center; z-index: 1; color: #fff; font-size: 13px; font-weight: 700; line-height: 1; }
.marca.pendiente { background: var(--aviso); }
.marca.fallo { background: var(--error); }
.marca.desconocido { background: var(--suave); }

/* Actualizando o en cola */
.carga { position: absolute; inset: 0; border-radius: inherit; background: #000a; display: grid; place-items: center; }
.carga::after { content: ""; width: 32px; height: 32px; border-radius: 50%; border: 4px solid #fff5; border-top-color: #fff; animation: girar .9s linear infinite; }
/* En cola: más claro y con puntos que giran despacio. */
.carga.cola { background: #0008; }
.carga.cola::after { border: 4px dotted #fff; animation-duration: 4s; }
@keyframes girar { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .carga::after { animation: none; } }

.ficha { display: flex; gap: 16px; align-items: center; margin: 16px 0; }
.ficha h2 { margin: 0; font-size: 1.4rem; color: inherit; text-transform: none; letter-spacing: 0; }
</style>
</head>
<body>
<header><h1><a href="/">domo-board</a></h1>{{end}}

{{define "icono"}}<span class="icono{{if .Grande}} grande{{end}}"><span class="inicial" aria-hidden="true">{{.Inicial}}</span>{{if .Icono}}<img src="{{.Icono}}" alt="" loading="lazy">{{end}}{{if .Marca}}<span class="marca {{.Marca}}" aria-hidden="true">{{if eq .Marca "pendiente"}}↑{{else if eq .Marca "fallo"}}!{{else}}?{{end}}</span>{{end}}{{if eq .Activo "en curso"}}<span class="carga"></span>{{else if eq .Activo "en cola"}}<span class="carga cola"></span>{{end}}</span>{{end}}

{{define "pie"}}</body>
</html>{{end}}
